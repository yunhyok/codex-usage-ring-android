name: v0.1.0 prerelease

on:
  push:
    tags:
      - v0.1.0

concurrency:
  group: release-v0.1.0
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  EVIDENCE_DIR: docs/evidence/v0.1.0

jobs:
  native-gate:
    name: Hard native NO-GO gate
    if: github.repository == 'yunhyok/codex-usage-ring-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android
          components: rustfmt, clippy
      - name: Install pinned Android NDK
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          fi
          test -n "$sdkmanager_path"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" --install 'ndk;28.2.13676358'
      - name: Configure ARM64 Android toolchain
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          ndk="$sdk_root/ndk/28.2.13676358"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="$toolchain/aarch64-linux-android29-clang"
          ar="$toolchain/llvm-ar"
          export ANDROID_NDK_ROOT="$ndk"
          export ANDROID_NDK_HOME="$ndk"
          export CC_aarch64_linux_android="$cc"
          export AR_aarch64_linux_android="$ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$cc"
          test -d "$ndk"
          test -x "$cc"
          test -x "$ar"
          {
            echo "ANDROID_NDK_ROOT=$ndk"
            echo "ANDROID_NDK_HOME=$ndk"
            echo "CC_aarch64_linux_android=$cc"
            echo "AR_aarch64_linux_android=$ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$cc"
          } >> "$GITHUB_ENV"
      - name: Rust format, clippy, and tests
        shell: bash
        run: |
          manifest='Cargo.toml'
          [[ -f native/Cargo.toml ]] && manifest='native/Cargo.toml'
          test -f "$manifest" || { echo 'Cargo.toml not found'; exit 1; }
          cargo fmt --manifest-path "$manifest" --all -- --check
          cargo clippy --locked --manifest-path "$manifest" --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path "$manifest" --workspace --all-features
      - name: Enforce Cargo license policy
        shell: pwsh
        run: ./scripts/verify-cargo-licenses.ps1
      - name: Run Android native gate (failure is NO-GO)
        shell: bash
        run: ./gradlew --no-daemon --stacktrace nativeGate
      - name: Validate candidate-bound native evidence and CI run
        id: candidate
        shell: pwsh
        run: |
          $e = Get-Content -Raw "$env:EVIDENCE_DIR/native-gate.json" | ConvertFrom-Json
          if ($e.status -ne 'pass' -or [string]::IsNullOrWhiteSpace([string]$e.candidate_commit) -or [string]::IsNullOrWhiteSpace([string]$e.run_url)) {
            throw 'native-gate.json must record status=pass, candidate_commit, and run_url.'
          }
          if ([string]$e.candidate_commit -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'native-gate.json candidate_commit must be a full source commit.'
          }
          & git merge-base --is-ancestor ([string]$e.candidate_commit) $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw 'candidate_commit must be an ancestor of the release tag; only evidence files may be added after the candidate.'
          }
          $allowed = @('docs/evidence/v0.1.0/native-gate.json','docs/evidence/v0.1.0/physical-device.json')
          $changed = @(& git diff --name-only ([string]$e.candidate_commit) $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0 -or ($changed | Where-Object { $_ -and $_ -notin $allowed }).Count -gt 0) { throw 'candidate-to-tag diff contains files outside the two reviewed evidence JSON files.' }
          $runPattern = '^https://github\.com/' + [regex]::Escape($env:GITHUB_REPOSITORY) + '/actions/runs/([0-9]+)$'
          $runMatch = [regex]::Match([string]$e.run_url, $runPattern)
          if (-not $runMatch.Success) { throw 'native-gate run_url must be this repository exact Actions URL.' }
          $runId = $runMatch.Groups[1].Value
          $headers = @{ Accept = 'application/vnd.github+json'; Authorization = "Bearer $env:GITHUB_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $run = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$runId" -Headers $headers
          if ([string]$run.head_sha -ine ([string]$e.candidate_commit) -or [string]$run.conclusion -ne 'success' -or [string]$run.name -ne 'CI' -or [string]$run.path -ne '.github/workflows/ci.yml') {
            throw 'native-gate run must be a successful repository CI workflow whose head_sha is candidate_commit.'
          }
          "run_id=$runId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "candidate_commit=$(([string]$e.candidate_commit).ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        env:
          EVIDENCE_DIR: ${{ env.EVIDENCE_DIR }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Extract native debug symbols
        shell: bash
        run: |
          so='native/target/aarch64-linux-android/release/libusage_ring_codex.so'
          objcopy="$ANDROID_SDK_ROOT/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy"
          test -s "$so"
          test -x "$objcopy"
          "$objcopy" --only-keep-debug "$so" "$so.dbg"
      - name: Upload native evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0.1.0-native-gate
          if-no-files-found: error
          path: |
            ${{ env.EVIDENCE_DIR }}/native-gate.json
            native/target/aarch64-linux-android/release/libusage_ring_codex.so
            native/target/aarch64-linux-android/release/libusage_ring_codex.so.dbg

  physical-device:
    name: Physical-device evidence gate
    if: github.repository == 'yunhyok/codex-usage-ring-android'
    outputs:
      run_id: ${{ steps.evidence.outputs.run_id }}
      candidate_commit: ${{ steps.evidence.outputs.candidate_commit }}
      apk_sha256: ${{ steps.evidence.outputs.apk_sha256 }}
      native_release_apk_sha256: ${{ steps.evidence.outputs.native_release_apk_sha256 }}
      instrumentation_apk_sha256: ${{ steps.evidence.outputs.instrumentation_apk_sha256 }}
      raw_native_library_sha256: ${{ steps.evidence.outputs.raw_native_library_sha256 }}
      packaged_native_library_sha256: ${{ steps.evidence.outputs.packaged_native_library_sha256 }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install pinned NDK for strip derivation
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" --install 'ndk;28.2.13676358'
          ndk="$sdk_root/ndk/28.2.13676358"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
      - name: Validate reviewed device evidence and resolve CI run
        id: evidence
        shell: pwsh
        run: |
          $path = Join-Path $env:EVIDENCE_DIR 'physical-device.json'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing physical-device evidence: $path" }
          $e = Get-Content -Raw $path | ConvertFrom-Json
          foreach ($field in @('device_model','android_api','abi','test_date','reviewer','run_url','candidate_commit','candidate_run_url','source_commit','apk_sha256','native_release_apk_sha256','instrumentation_apk_sha256','raw_native_library_sha256','packaged_native_library_sha256','strip_derivation','tested_release_apk_sha256','tested_instrumentation_apk_sha256','test_signing_certificate_sha256','release_payload_derivation')) {
            if ([string]::IsNullOrWhiteSpace([string]$e.$field)) { throw "physical-device.json is missing $field" }
          }
          if ([string]$e.android_api -notmatch '^[0-9]+$' -or [int]$e.android_api -lt 29) {
            throw 'physical-device.json android_api must be an integer >= 29.'
          }
          if ([string]$e.abi -ne 'arm64-v8a') {
            throw "physical-device.json abi must be exactly arm64-v8a (found '$($e.abi)')."
          }
          if ([string]$e.candidate_commit -notmatch '^[0-9a-fA-F]{40}$' -or [string]$e.source_commit -ine ([string]$e.candidate_commit)) {
            throw 'physical-device.json source_commit must equal candidate_commit.'
          }
          & git merge-base --is-ancestor ([string]$e.candidate_commit) $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'physical-device candidate_commit must be an ancestor of the release tag.' }
          $allowed = @('docs/evidence/v0.1.0/native-gate.json','docs/evidence/v0.1.0/physical-device.json')
          $changed = @(& git diff --name-only ([string]$e.candidate_commit) $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0 -or ($changed | Where-Object { $_ -and $_ -notin $allowed }).Count -gt 0) { throw 'candidate-to-tag diff contains files outside the two reviewed evidence JSON files.' }
          foreach ($field in @('apk_sha256','native_release_apk_sha256','instrumentation_apk_sha256','raw_native_library_sha256','packaged_native_library_sha256','tested_release_apk_sha256','tested_instrumentation_apk_sha256','test_signing_certificate_sha256')) {
            if ([string]$e.$field -notmatch '^[0-9a-fA-F]{64}$') { throw "physical-device.json $field must be a SHA-256 digest." }
          }
          if ([string]$e.release_payload_derivation -ne 'apksigner-sign-only') { throw 'physical-device.json must attest release_payload_derivation=apksigner-sign-only.' }
          if ([string]$e.strip_derivation -ne 'ndk-28.2.13676358-llvm-strip-unneeded') { throw 'physical-device.json must identify the pinned NDK strip derivation.' }
          $runPattern = '^https://github\.com/' + [regex]::Escape($env:GITHUB_REPOSITORY) + '/actions/runs/([0-9]+)$'
          $runMatch = [regex]::Match([string]$e.run_url, $runPattern)
          if (-not $runMatch.Success) { throw "physical-device.json run_url must be this repository's exact Actions run URL (without query strings)." }
          if ([string]$e.candidate_run_url -ne [string]$e.run_url) { throw 'physical-device.json candidate_run_url must equal the reviewed candidate CI run_url.' }
          $runId = $runMatch.Groups[1].Value
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          try {
            $run = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$runId" -Headers $headers
          } catch {
            throw "could not resolve the reviewed CI run metadata: $($_.Exception.Message)"
          }
          if ([string]$run.head_sha -notmatch '^[0-9a-fA-F]{40}$' -or $run.head_sha.ToLowerInvariant() -ne ([string]$e.candidate_commit).ToLowerInvariant()) {
            throw 'reviewed CI run head_sha must exactly match physical-device candidate_commit.'
          }
          if ([string]$run.conclusion -ne 'success') {
            throw "reviewed CI run $runId must have conclusion=success (found '$($run.conclusion)')."
          }
          if ([string]$run.name -ne 'CI' -or [string]$run.path -ne '.github/workflows/ci.yml') {
            throw "reviewed run $runId must be the repository CI workflow (found '$($run.name)' at '$($run.path)')."
          }
          "run_id=$runId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "candidate_commit=$(([string]$e.candidate_commit).ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          foreach ($field in @('apk_sha256','native_release_apk_sha256','instrumentation_apk_sha256','raw_native_library_sha256','packaged_native_library_sha256')) { "$field=$(([string]$e.$field).ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append }
          $requiredChecks = @(
            'install',
            'launch',
            'native_release_install',
            'native_release_instrumentation',
            'native_load',
            'tls_system_trust',
            'device_code_login',
            'restart_token_refresh',
            'process_recovery',
            'rate_limits_read',
            'refresh_25',
            'widget_add_resize',
            'notification_dismiss_restore',
            'offline_recovery',
            'logout_relogin',
            'reboot_recovery',
            'secret_log_scan',
            'plugin_mcp_blocked',
            'uninstall'
          )
          foreach ($field in $requiredChecks) {
            if ($e.$field -ne 'pass') { throw "physical-device.json field $field must be pass" }
          }
          if ($e.status -ne 'pass') { throw 'physical-device.json status must be pass' }
        env:
          EVIDENCE_DIR: ${{ env.EVIDENCE_DIR }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download exact native candidate set from reviewed CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-ci-${{ steps.evidence.outputs.candidate_commit }}
          path: native-ci-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.evidence.outputs.run_id }}

      - name: Verify physical APK hash against CI artifact
        shell: pwsh
        env:
          EXPECTED_APK_SHA256: ${{ steps.evidence.outputs.apk_sha256 }}
          EXPECTED_RELEASE_APK_SHA256: ${{ steps.evidence.outputs.native_release_apk_sha256 }}
          EXPECTED_INSTRUMENTATION_APK_SHA256: ${{ steps.evidence.outputs.instrumentation_apk_sha256 }}
          EXPECTED_RAW_NATIVE_LIBRARY_SHA256: ${{ steps.evidence.outputs.raw_native_library_sha256 }}
          EXPECTED_PACKAGED_NATIVE_LIBRARY_SHA256: ${{ steps.evidence.outputs.packaged_native_library_sha256 }}
        run: |
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'native-ci-artifact'
          $apkCandidates = @(Get-ChildItem -LiteralPath $artifactRoot -Recurse -File -Filter 'app-native-debug.apk' -ErrorAction Stop)
          $releaseCandidates = @(Get-ChildItem -LiteralPath $artifactRoot -Recurse -File -Filter 'app-native-release-unsigned.apk' -ErrorAction Stop)
          $testCandidates = @(Get-ChildItem -LiteralPath $artifactRoot -Recurse -File -Filter 'app-native-debug-androidTest.apk' -ErrorAction Stop)
          if ($apkCandidates.Count -ne 1 -or $releaseCandidates.Count -ne 1 -or $testCandidates.Count -ne 1) { throw 'candidate artifact must contain exactly one debug APK, unsigned release APK, and instrumentation APK.' }
          $staticCandidates = @(Get-ChildItem -LiteralPath $artifactRoot -Recurse -File -Filter 'static-apk.json' -ErrorAction Stop)
          if ($staticCandidates.Count -ne 1) { throw "expected exactly one static-apk.json in the reviewed CI artifact (found $($staticCandidates.Count))." }
          $gateCandidates = @(Get-ChildItem -LiteralPath $artifactRoot -Recurse -File -Filter 'gate-report.local.json' -ErrorAction Stop)
          if ($gateCandidates.Count -ne 1) { throw "expected exactly one hard native gate report in the reviewed CI artifact (found $($gateCandidates.Count))." }
          $apk = $apkCandidates[0]
          try {
            $static = Get-Content -LiteralPath $staticCandidates[0].FullName -Raw | ConvertFrom-Json
            $gate = Get-Content -LiteralPath $gateCandidates[0].FullName -Raw | ConvertFrom-Json
          } catch {
            throw "candidate static/native gate evidence is not valid JSON: $($_.Exception.Message)"
          }
          if ($static.status -ne 'pass') { throw 'reviewed CI static-apk.json status must be pass.' }
          if ($gate.status -ne 'GO' -or [string]$gate.checks.codex_in_process_runtime.status -ne 'PASS') { throw 'reviewed CI hard native gate must be GO with codex runtime PASS.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Get-ZipEntrySha256([string]$ArchivePath, [string]$EntryName) {
            $archive = [IO.Compression.ZipFile]::OpenRead($ArchivePath)
            try {
              $entry = $archive.GetEntry($EntryName)
              if ($null -eq $entry) { throw "APK is missing $EntryName." }
              $stream = $entry.Open()
              try {
                $sha = [Security.Cryptography.SHA256]::Create()
                try { return ([BitConverter]::ToString($sha.ComputeHash($stream))).Replace('-', '').ToLowerInvariant() }
                finally { $sha.Dispose() }
              } finally { $stream.Dispose() }
            } finally { $archive.Dispose() }
          }
          $expected = ([string]$env:EXPECTED_APK_SHA256).ToLowerInvariant()
          $apkHash = (Get-FileHash -LiteralPath $apk.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($apkHash -ne $expected) { throw "nativeDebug APK hash $apkHash does not match physical-device.json apk_sha256 $expected." }
          $staticHash = ([string]$static.apk_sha256).ToLowerInvariant()
          if ($staticHash -notmatch '^[0-9a-f]{64}$' -or $staticHash -ne $expected) { throw 'static-apk.json apk_sha256 does not match physical-device.json apk_sha256.' }
          $releaseHash = (Get-FileHash -LiteralPath $releaseCandidates[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($releaseHash -ne $env:EXPECTED_RELEASE_APK_SHA256) { throw 'unsigned native release APK hash does not match physical-device evidence.' }
          $testHash = (Get-FileHash -LiteralPath $testCandidates[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($testHash -ne $env:EXPECTED_INSTRUMENTATION_APK_SHA256) { throw 'instrumentation APK hash does not match physical-device evidence.' }
          $rawNativeCandidates = @(Get-ChildItem -LiteralPath $artifactRoot -Recurse -File -Filter 'libusage_ring_codex.so' -ErrorAction Stop)
          if ($rawNativeCandidates.Count -ne 1) { throw "candidate artifact must contain exactly one raw native library (found $($rawNativeCandidates.Count))." }
          $debugSymbolCandidates = @(Get-ChildItem -LiteralPath $artifactRoot -Recurse -File -Filter 'libusage_ring_codex.so.dbg' -ErrorAction Stop)
          if ($debugSymbolCandidates.Count -ne 1 -or $debugSymbolCandidates[0].Length -le 0) { throw 'candidate artifact must contain exactly one non-empty libusage_ring_codex.so.dbg.' }
          $rawNativeHash = (Get-FileHash -LiteralPath $rawNativeCandidates[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $strip = Join-Path $env:ANDROID_NDK_ROOT 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          $stripTemp = Join-Path ([IO.Path]::GetTempPath()) ('usage-ring-release-strip-' + [guid]::NewGuid().ToString('N') + '.so')
          $stripFailure = $null
          try {
            Copy-Item -LiteralPath $rawNativeCandidates[0].FullName -Destination $stripTemp -Force -ErrorAction Stop
            & $strip --strip-unneeded $stripTemp 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'pinned NDK llvm-strip failed.' }
            $packagedNativeHash = (Get-FileHash -LiteralPath $stripTemp -Algorithm SHA256).Hash.ToLowerInvariant()
          } catch { $stripFailure = $_ }
          finally {
            $stripCleanupFailure = $null
            try {
              if (Test-Path -LiteralPath $stripTemp) { Remove-Item -LiteralPath $stripTemp -Force -ErrorAction Stop }
              if (Test-Path -LiteralPath $stripTemp) { throw 'strip derivation temporary copy was not deleted.' }
            } catch { $stripCleanupFailure = $_ }
            if ($null -ne $stripFailure -and $null -ne $stripCleanupFailure) { throw 'strip derivation and temporary-copy cleanup both failed.' }
            if ($null -ne $stripFailure) { throw 'strip derivation failed.' }
            if ($null -ne $stripCleanupFailure) { throw 'strip derivation cleanup failed.' }
          }
          $debugEmbeddedNativeHash = Get-ZipEntrySha256 $apk.FullName 'lib/arm64-v8a/libusage_ring_codex.so'
          $releaseEmbeddedNativeHash = Get-ZipEntrySha256 $releaseCandidates[0].FullName 'lib/arm64-v8a/libusage_ring_codex.so'
          $expectedRawNativeHash = ([string]$env:EXPECTED_RAW_NATIVE_LIBRARY_SHA256).ToLowerInvariant()
          $expectedPackagedNativeHash = ([string]$env:EXPECTED_PACKAGED_NATIVE_LIBRARY_SHA256).ToLowerInvariant()
          if ($rawNativeHash -ne $expectedRawNativeHash -or $packagedNativeHash -ne $expectedPackagedNativeHash -or $debugEmbeddedNativeHash -ne $expectedPackagedNativeHash -or $releaseEmbeddedNativeHash -ne $expectedPackagedNativeHash) {
            throw 'raw native library strip derivation and both embedded APK native libraries do not match physical-device evidence.'
          }
          if (([string]$static.native_release_apk_sha256).ToLowerInvariant() -ne $releaseHash -or ([string]$static.instrumentation_apk_sha256).ToLowerInvariant() -ne $testHash -or ([string]$static.raw_native_library_sha256).ToLowerInvariant() -ne $expectedRawNativeHash -or ([string]$static.packaged_native_library_sha256).ToLowerInvariant() -ne $expectedPackagedNativeHash -or [string]$static.strip_derivation -ne 'ndk-28.2.13676358-llvm-strip-unneeded') { throw 'static physical-device report hash set does not match candidate strip derivation.' }
          if (([string]$gate.checks.codex_in_process_runtime.evidence.release_so_sha256).ToLowerInvariant() -ne $expectedRawNativeHash) { throw 'hard native gate raw library digest does not match physical evidence.' }
          Write-Output "Verified nativeDebug candidate: $($apk.FullName)"
          Write-Output "Verified candidate SHA256: $apkHash"

  build-sign-verify:
    name: Build, sign, verify, SBOM, and attest
    needs: [native-gate, physical-device]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: prerelease
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install pinned Android build tools
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" --install 'build-tools;36.0.0' 'platform-tools'
          test -x "$sdk_root/build-tools/36.0.0/apksigner"
          test -x "$sdk_root/build-tools/36.0.0/aapt"
          test -x "$sdk_root/cmdline-tools/latest/bin/apkanalyzer"
      - name: Download exact candidate artifact (no rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-ci-${{ needs.physical-device.outputs.candidate_commit }}
          path: candidate-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.physical-device.outputs.run_id }}
      - name: Verify vendored verifier and candidate payload
        shell: pwsh
        run: |
          ./scripts/verify-rustls-vendor.ps1 -RequireApproved
          $root = Join-Path $env:GITHUB_WORKSPACE 'candidate-artifact'
          $release = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter 'app-native-release-unsigned.apk')
          if ($release.Count -ne 1) { throw 'candidate artifact must contain exactly one unsigned native release APK.' }
          $expected = '${{ needs.physical-device.outputs.native_release_apk_sha256 }}'.ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $release[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'candidate unsigned release APK hash mismatch.' }
          "UNSIGNED_RELEASE_APK=$($release[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Preflight signing policy before secret-bearing step
        shell: pwsh
        run: |
          $policy = Get-Content -LiteralPath 'scripts/release/signing-policy.json' -Raw | ConvertFrom-Json
          if ([string]$policy.status -ne 'approved' -or [string]$policy.sha256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw 'release signing policy must be approved with an exact certificate SHA-256 before signing secrets are used.'
          }
          $native = Get-Content -LiteralPath (Join-Path $env:EVIDENCE_DIR 'native-gate.json') -Raw | ConvertFrom-Json
          $physical = Get-Content -LiteralPath (Join-Path $env:EVIDENCE_DIR 'physical-device.json') -Raw | ConvertFrom-Json
          if ([string]$native.candidate_commit -notmatch '^[0-9a-fA-F]{40}$' -or [string]$physical.candidate_commit -notmatch '^[0-9a-fA-F]{40}$' -or ([string]$native.candidate_commit).ToLowerInvariant() -ne ([string]$physical.candidate_commit).ToLowerInvariant()) {
            throw 'native-gate and physical-device evidence must identify the same candidate commit before signing secrets are used.'
          }
      - name: Sign exact candidate payload and delete keystore
        id: apk
        shell: pwsh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          foreach ($name in @('ANDROID_KEYSTORE_B64','ANDROID_KEY_ALIAS','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing external signing secret: $name" }
          }
          $sdk = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          if ([string]::IsNullOrWhiteSpace($sdk)) { throw 'ANDROID_SDK_ROOT/ANDROID_HOME is required to sign the reviewed candidate.' }
          $signer = Join-Path $sdk 'build-tools/36.0.0/apksigner'
          if (-not (Test-Path -LiteralPath $signer -PathType Leaf) -or [IO.Path]::GetFileName($signer) -ne 'apksigner' -or [IO.Path]::GetExtension($signer) -eq '.jar') {
            throw 'pinned Android build-tools 36.0.0 executable apksigner was not found.'
          }
          $unsignedCheck = (& $signer verify --verbose $env:UNSIGNED_RELEASE_APK 2>&1) -join "`n"
          if ($LASTEXITCODE -eq 0 -or $unsignedCheck -notmatch '(?i)(does not verify|no signers|not signed)') {
            throw 'candidate APK was not proven to be unsigned by the pinned apksigner.'
          }
          $keystore = Join-Path $env:RUNNER_TEMP 'usage-ring-release.jks'
          $signed = Join-Path $env:RUNNER_TEMP 'usage-ring-release-signed.apk'
          $signingFailure = $null
          try {
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_B64))
            & $signer sign --ks $keystore --ks-key-alias $env:ANDROID_KEY_ALIAS --ks-pass 'env:ANDROID_KEYSTORE_PASSWORD' --key-pass 'env:ANDROID_KEY_PASSWORD' --out $signed $env:UNSIGNED_RELEASE_APK
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $signed -PathType Leaf)) { throw 'apksigner failed to sign the exact candidate payload.' }
          } catch {
            $signingFailure = $_
          } finally {
            $cleanupFailure = $null
            try {
              if (Test-Path -LiteralPath $keystore) { Remove-Item -LiteralPath $keystore -Force -ErrorAction Stop }
              if (Test-Path -LiteralPath $keystore) { throw 'materialized keystore was not deleted.' }
            } catch {
              $cleanupFailure = $_
            }
            if ($null -ne $signingFailure -and $null -ne $cleanupFailure) { throw 'candidate signing and keystore cleanup both failed.' }
            if ($null -ne $signingFailure) { throw 'candidate signing failed.' }
            if ($null -ne $cleanupFailure) { throw 'keystore cleanup failed.' }
          }
          "path=$signed" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Enforce dependency license policy
        shell: pwsh
        run: |
          ./scripts/ensure-release-sbom.ps1 -BomPath 'candidate-artifact/build/reports/cyclonedx/bom.json'
          ./scripts/verify-sbom.ps1 -BomPath 'candidate-artifact/build/reports/cyclonedx/bom.json' -RequireRustlsVerifier
          Copy-Item -LiteralPath 'candidate-artifact/build/reports/cyclonedx/bom.json' -Destination 'usage-ring-v0.1.0.cdx.json'
      - name: Verify APK and hard release preflight
        shell: pwsh
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/release/preflight.ps1" -Tag v0.1.0 -EvidenceDir $env:EVIDENCE_DIR -ApkPath $env:APK_PATH -SigningPolicyPath 'scripts/release/signing-policy.json' -RequireSigning
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-FileHash -LiteralPath $env:APK_PATH -Algorithm SHA256).Hash.ToLowerInvariant() | Out-File -FilePath release.apk.sha256 -Encoding ascii
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ steps.apk.outputs.path }}
          artifact-name: usage-ring-v0.1.0.spdx.json
          output-file: usage-ring-v0.1.0.spdx.json
      - name: Generate source-tree and lockfile SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ github.workspace }}
          artifact-name: usage-ring-v0.1.0-source.spdx.json
          output-file: usage-ring-v0.1.0-source.spdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ steps.apk.outputs.path }}
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usage-ring-v0.1.0-release
          if-no-files-found: error
          path: |
            ${{ steps.apk.outputs.path }}
            release.apk.sha256
            usage-ring-v0.1.0.spdx.json
            usage-ring-v0.1.0-source.spdx.json
            usage-ring-v0.1.0.cdx.json
            candidate-artifact/native/target/aarch64-linux-android/release/libusage_ring_codex.so
            candidate-artifact/native/target/aarch64-linux-android/release/libusage_ring_codex.so.dbg

  publish:
    name: Publish GitHub prerelease
    needs: build-sign-verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: usage-ring-v0.1.0-release
          path: dist
      - name: Publish v0.1.0 as prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v0.1.0
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**/*.apk
            dist/release.apk.sha256
            dist/usage-ring-v0.1.0.spdx.json
            dist/usage-ring-v0.1.0-source.spdx.json
            dist/usage-ring-v0.1.0.cdx.json
            dist/**/libusage_ring_codex.so.dbg
