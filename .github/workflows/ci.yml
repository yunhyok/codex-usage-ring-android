name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  android:
    name: Android tests, lint, and mockDebug
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Run tests, lint, mockDebug, and dependency SBOM
        shell: bash
        run: ./gradlew --no-daemon --stacktrace testMockDebugUnitTest lintMockDebug assembleMockDebug cyclonedxBom
      - name: Enforce dependency license policy
        shell: pwsh
        run: ./scripts/verify-sbom.ps1
      - name: Upload Android reports and mock APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-ci-${{ github.sha }}
          if-no-files-found: warn
          path: |
            **/build/reports/**
            **/build/test-results/**
            app/build/outputs/apk/mock/debug/*.apk
            build/reports/cyclonedx/bom.json
            build/reports/cyclonedx/bom.xml

  native:
    name: Rust scaffold, ARM64 cross-build, and feasibility report
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android
          components: rustfmt, clippy
      - name: Install pinned Android NDK
        shell: bash
        run: |
          command -v sdkmanager
          test -n "$ANDROID_SDK_ROOT"
          sdkmanager --install 'ndk;28.2.13676358'
      - name: Rust format check
        shell: bash
        run: |
          manifest='Cargo.toml'
          [[ -f native/Cargo.toml ]] && manifest='native/Cargo.toml'
          test -f "$manifest" || { echo 'Cargo.toml not found'; exit 1; }
          cargo fmt --manifest-path "$manifest" --all -- --check
      - name: Rust clippy
        shell: bash
        run: |
          manifest='Cargo.toml'
          [[ -f native/Cargo.toml ]] && manifest='native/Cargo.toml'
          cargo clippy --manifest-path "$manifest" --workspace --all-targets --all-features -- -D warnings
      - name: Rust tests
        shell: bash
        run: |
          manifest='Cargo.toml'
          [[ -f native/Cargo.toml ]] && manifest='native/Cargo.toml'
          cargo test --manifest-path "$manifest" --workspace --all-features
      - name: Enforce Cargo license policy
        shell: pwsh
        run: ./scripts/verify-cargo-licenses.ps1
      - name: Cross-build the JNI boundary for ARM64 Android
        shell: bash
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
        run: cargo build --manifest-path native/Cargo.toml --target aarch64-linux-android --release
      - name: Generate the fail-closed upstream feasibility report
        continue-on-error: true
        shell: bash
        run: ./gradlew --no-daemon --stacktrace nativeGateReport
      - name: Upload native reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-ci-${{ github.sha }}
          if-no-files-found: warn
          path: |
            **/build/reports/**
            **/build/test-results/**
            native/gate-report.local.json
            native/target/aarch64-linux-android/release/libusage_ring_codex.so

  supply-chain:
    name: Secret scan and dependency review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
