name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  android:
    name: Android tests, lint, and mockDebug
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Run tests, lint, mockDebug, and dependency SBOM
        shell: bash
        run: ./gradlew --no-daemon --stacktrace testMockDebugUnitTest lintMockDebug assembleMockDebug cyclonedxBom
      - name: Enforce dependency license policy
        shell: pwsh
        run: ./scripts/verify-sbom.ps1
      - name: Upload Android reports and mock APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-ci-${{ github.sha }}
          if-no-files-found: warn
          path: |
            **/build/reports/**
            **/build/test-results/**
            app/build/outputs/apk/mock/debug/*.apk
            build/reports/cyclonedx/bom.json
            build/reports/cyclonedx/bom.xml

  native:
    name: Rust native runtime, ARM64 cross-build, and feasibility report
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android
          components: rustfmt, clippy
      - name: Install pinned Android NDK
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          fi
          test -n "$sdkmanager_path"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" --install 'ndk;28.2.13676358'
      - name: Rust format check
        shell: bash
        run: |
          manifest='Cargo.toml'
          [[ -f native/Cargo.toml ]] && manifest='native/Cargo.toml'
          test -f "$manifest" || { echo 'Cargo.toml not found'; exit 1; }
          cargo fmt --manifest-path "$manifest" --all -- --check
      - name: Rust clippy
        shell: bash
        run: |
          manifest='Cargo.toml'
          [[ -f native/Cargo.toml ]] && manifest='native/Cargo.toml'
          cargo clippy --locked --manifest-path "$manifest" --workspace --all-targets --all-features -- -D warnings
      - name: Rust tests
        shell: bash
        run: |
          manifest='Cargo.toml'
          [[ -f native/Cargo.toml ]] && manifest='native/Cargo.toml'
          cargo test --locked --manifest-path "$manifest" --workspace --all-features
      - name: Enforce Cargo license policy
        shell: pwsh
        run: ./scripts/verify-cargo-licenses.ps1
      - name: Cross-build the JNI boundary for ARM64 Android
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$sdk_root/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          test -x "$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          cargo build --locked --manifest-path native/Cargo.toml --target aarch64-linux-android --release
      - name: Package the physical-device candidate APK
        shell: bash
        run: ./gradlew --no-daemon --stacktrace assembleNativeDebug
      - name: Verify the static physical-device candidate
        shell: pwsh
        run: ./scripts/device/physical-device-preflight.ps1 -PrepareOnly
      - name: Generate the fail-closed upstream feasibility report
        continue-on-error: true
        shell: bash
        run: ./gradlew --no-daemon --stacktrace nativeGateReport
      - name: Upload native reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ci-${{ github.sha }}
          if-no-files-found: warn
          path: |
            **/build/reports/**
            **/build/test-results/**
            native/gate-report.local.json
            native/target/aarch64-linux-android/release/libusage_ring_codex.so
            app/build/outputs/apk/native/debug/app-native-debug.apk
            app/build/reports/physical-device/static-apk.json

  supply-chain:
    name: Secret scan and dependency review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: 8.30.1
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
