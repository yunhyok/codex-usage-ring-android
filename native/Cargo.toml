[package]
name = "usage-ring-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Fail-closed JNI boundary for Usage Ring's Codex account controls"
license = "Apache-2.0"

[lib]
name = "usage_ring_codex"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
